[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pnadcpainel"
version = "0.1.1"
description = "Painel Consolidado Pessoa e Domicilio da PNAD Continua (IBGE + Data Zoom)"
readme = "README.md"
authors = [
    { name = "Giordano Bueno", email = "giordanobueno@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["pnadc", "ibge", "datazoom", "longitudinal", "panel", "microdata", "brazil"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
arrow = [
    "pyarrow>=12.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pyarrow>=12.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/giordanobueno/pnadcpainel-py"
Repository = "https://github.com/giordanobueno/pnadcpainel-py"
"R Package Version" = "https://github.com/giordanobueno/pnadcpainel"

[tool.hatch.build.targets.wheel]
packages = ["src/pnadcpainel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
